<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>module04: iframe</title>
</head>
<body>
    <!--
    embed another website content
    within your website

    attributes:
    src - link to the source online
    width< height - size of window (pixels)

    -->
    <iframe
    <iframe width="560"
     height="315"
    src="https://www.youtube.com/embed/f-T3zefKZFQ?si=pGvREyToCY0IuSOW"
    title="YouTube video player" 
    frameborder="0"
    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
    referrerpolicy="strict-origin-when-cross-origin" 
    allowfullscreen></iframe>
</body>
</html>
